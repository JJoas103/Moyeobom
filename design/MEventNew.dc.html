<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans KR", -apple-system, sans-serif; background: #f4f6f9; color: #1e293b; -webkit-font-smoothing: antialiased; }
    a { color: #1d9e75; } a:hover { color: #16a34a; }
  </style>
</helmet>

<div style="width: 390px; height: 896px; display: flex; flex-direction: column; background: #f4f6f9;">

  <div style="display: flex; align-items: center; gap: 8px; padding: 13px 16px; background: #1e293b; flex-shrink: 0;">
    <span style="font-size: 10.5px; font-weight: 700; color: #ffffff; background: #1d9e75; padding: 3px 9px; border-radius: 100px; white-space: nowrap;">신규</span>
    <span style="font-size: 11.5px; font-weight: 500; color: #cbd5e1; line-height: 1.35;">&ldquo;초기에 모임이 하나도 없으면요?&rdquo;에 대한 답</span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #ffffff; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span style="font-size: 15px; font-weight: 700;">행사</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
    </div>

    <div style="flex-grow: 1; overflow: hidden;">

      <div style="height: 194px; background: linear-gradient(150deg, #0f766e 0%, #1d9e75 55%, #6ee7c7 100%); position: relative; display: flex; align-items: flex-end; padding: 18px;">
        <div style="position: absolute; top: 14px; left: 16px; font-size: 10.5px; font-weight: 700; color: #065f46; background: rgba(255,255,255,0.92); padding: 4px 10px; border-radius: 100px;">전시</div>
        <div style="color: #ffffff;">
          <div style="font-size: 21px; font-weight: 900; letter-spacing: -0.4px; line-height: 1.25;">사물의 재구성</div>
          <div style="font-size: 12.5px; font-weight: 500; opacity: 0.9; margin-top: 5px;">서울시립미술관 서소문본관</div>
        </div>
      </div>

      <div style="background: #ffffff; padding: 16px; border-bottom: 8px solid #f4f6f9;">
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; gap: 10px; align-items: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span style="font-size: 13px; color: #1e293b;">2026.09.01 &ndash; 11.30</span>
          </div>
          <div style="display: flex; gap: 10px; align-items: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span style="font-size: 13px; color: #1e293b;">중구 덕수궁길 61</span>
          </div>
          <div style="display: flex; gap: 10px; align-items: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg>
            <span style="font-size: 13px; color: #1e293b;">무료</span>
          </div>
        </div>
        <div style="margin-top: 13px; padding-top: 12px; border-top: 1px dashed #e2e8f0; font-size: 11px; color: #94a3b8;">서울시 문화행사 API에서 자동 수집 &middot; 오늘 등록됨</div>
      </div>

      <div style="background: #ffffff; padding: 16px; border-bottom: 8px solid #f4f6f9;">
        <div style="display: flex; align-items: baseline; gap: 7px; margin-bottom: 13px;">
          <span style="font-size: 14.5px; font-weight: 700;">이 행사를 본 사람들</span>
          <span style="font-size: 13px; font-weight: 700; color: #cbd5e1;">0</span>
        </div>
        <div style="border: 1px dashed #e2e8f0; border-radius: 12px; padding: 26px 18px; text-align: center; background: #f8fafc;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 9px;"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <div style="font-size: 13px; font-weight: 600; color: #64748b;">아직 남겨진 감상이 없어요</div>
          <div style="font-size: 11.5px; color: #94a3b8; margin-top: 4px; line-height: 1.5;">보고 나서 한 줄 남기면<br>다음 사람에게 도움이 됩니다</div>
        </div>
      </div>

      <div style="background: #ffffff; padding: 16px;">
        <div style="display: flex; align-items: baseline; gap: 7px; margin-bottom: 13px;">
          <span style="font-size: 14.5px; font-weight: 700;">같이 갈 모임</span>
          <span style="font-size: 13px; font-weight: 700; color: #cbd5e1;">0</span>
        </div>
        <div style="background: #e6f9f4; border: 1px solid #6ee7c7; border-radius: 12px; padding: 18px 16px; text-align: center;">
          <div style="font-size: 13px; font-weight: 600; color: #065f46; line-height: 1.5;">아직 모임이 없습니다.<br>첫 모임을 열어보세요.</div>
          <button style="width: 100%; margin-top: 14px; padding: 13px; background: #1d9e75; color: #ffffff; border: none; border-radius: 10px; font-size: 14.5px; font-weight: 700; font-family: inherit; min-height: 46px;">이 행사 첫 모임 만들기</button>
          <div style="font-size: 11px; color: #047857; margin-top: 9px; line-height: 1.45;">제목 &middot; 날짜 &middot; 장소 &middot; 좌표는 이미 채워져 있습니다</div>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
